name: Build BMW E90 APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build Debug APK
        run: |
          mkdir -p app/src/main/java/com/bmw/smartdrive/e90
          echo 'plugins { id("com.android.application") version "8.2.0" }' > build.gradle.kts
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BMW-APK
          path: app/build/outputs/apk/debug/app-debug.apk
Continue building the complete BMW Smart Drive AI – E90 Edition Android application. Do not stop at a prototype, mockup, or UI-only preview.

Target vehicle: BMW E90 320i, model year 2006.
Target device: AWESAFE 7-inch Android head unit, Android 12.

1. Main dashboard

- Create a premium futuristic BMW-inspired dashboard, landscape orientation (1024x600 adaptable).
- Dark sporty design with blue accents.
- Large speedometer and RPM gauge.
- Show actual GPS speed when available.
- Never fabricate vehicle readings.
- Display GPS signal and connection status.

2. Vehicle integration

- Implement Bluetooth OBD-II adapter connection and disconnection.
- Read supported real-time parameters: engine RPM, coolant temperature, vehicle speed, battery voltage, and diagnostic trouble codes (DTCs).
- Detect unsupported PIDs and show clear messages.
- Do not simulate OBD data.
- Do not implement ECU coding, writing, or automatic fault clearing.
- Include adapter compatibility guidance for a 2006 BMW E90 320i.

3. Navigation and media

- Add working Google Maps and Waze launch buttons.
- Add music player shortcuts and media controls where Android permits.
- Make navigation and music work without blocking the dashboard.

4. Personalization

- Arabic, Dutch, and English languages.
- RTL support for Arabic.
- Day and night themes.
- Allow users to select personal photos as wallpapers.
- Include BMW-inspired, road, mountain, city, and map backgrounds.
- Save preferences between restarts.

5. Additional screens

- Dashboard.
- Navigation.
- OBD diagnostics.
- Vehicle information.
- Settings.
- Wallpaper gallery.
- About and permissions.

6. Technical requirements

- Build a genuine native Android application, not merely a website or WebView wrapper.
- Use Kotlin and Jetpack Compose if supported.
- Set a suitable minimum Android SDK and target Android 12 compatibility.
- Request only necessary permissions.
- Handle Bluetooth permissions correctly on Android 12.
- Handle GPS permissions and location failures.
- Optimize for landscape 7-inch head units.
- Make all buttons functional.
- Add error handling and connection status indicators.
- Keep the app stable when Bluetooth or GPS is unavailable.

7. Final delivery — mandatory

1. Complete the implementation.
2. Build a signed or installable Android APK.
3. Run a build and resolve compilation errors.
4. Verify that the APK file exists and provide its actual size.
5. Provide the APK download link.
6. Provide source code as a separate deliverable.
7. Clearly list any features that still require physical testing in the car.

Do not tell me the project is complete if you only generated a preview. Do not stop to ask me to write code. Continue independently until you have built the APK or identify a genuine technical blocker.
